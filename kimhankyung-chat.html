<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#B2C7DA">
<title>루미의 네온 UXUI 상담소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 데스크톱에서는 가운데 폰 프레임, 모바일에서는 전체 화면. 카카오톡 채팅방 구조(헤더 · 대화 · 입력바) */
:root{
  --room:#B2C7DA;        /* 채팅방 배경 */
  --header:#B2C7DA;
  --mine:#FEE500;        /* 내 말풍선 */
  --mine-fg:#191919;
  --theirs:#FFFFFF;      /* 상대 말풍선 */
  --theirs-fg:#191919;
  --fg:#191919;
  --muted:#556677;
  --time:#4A5B6C;
  --bar:#FFFFFF;
  --field:#F2F3F5;
  --line:#D5DDE6;
  --sheet:#FFFFFF;
  --chip:#FFFFFFCC;
  --danger:#D93025;
  --outside:#E6EBF0;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --room:#1F2A33; --header:#1F2A33;
    --mine:#FEE500; --mine-fg:#191919;
    --theirs:#2E3A44; --theirs-fg:#ECEFF2;
    --fg:#ECEFF2; --muted:#9AAAB8; --time:#8C9BA8;
    --bar:#151C22; --field:#25303A; --line:#2E3A44;
    --sheet:#1A232B; --chip:#2E3A44CC; --outside:#0E1418;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--outside);color:var(--fg);font-family:var(--font);font-size:15px;
  display:flex;justify-content:center;align-items:center}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #3A7BD5;outline-offset:2px}

.phone{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;background:var(--room);
  display:flex;flex-direction:column;overflow:hidden}
@media (min-width:500px){
  .phone{height:calc(100% - 48px);border-radius:32px;box-shadow:0 20px 60px #0003}
}

/* 헤더 */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--header)}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.icon-btn{width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:#0000000F}
.icon-btn svg{width:22px;height:22px}

/* 대화 영역 */
.log{flex:1;overflow-y:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.date{align-self:center;margin:12px 0 8px;font-size:12px;color:#fff;background:#00000026;padding:4px 12px;border-radius:12px}
.notice{align-self:center;max-width:90%;text-align:center;font-size:12.5px;color:var(--fg);background:var(--chip);padding:8px 12px;border-radius:10px;line-height:1.5}

.row{display:flex;gap:8px;align-items:flex-start}
.row.mine{justify-content:flex-end}
.avatar{width:40px;height:40px;flex:none;border-radius:15px;background:linear-gradient(145deg,#5B8DEF,#2F5FB8);
  color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;letter-spacing:-.5px}
.avatar.ghost{visibility:hidden;height:0}
.col{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:74%}
.name{font-size:13px;color:var(--fg);opacity:.85;margin-left:2px}
.line{display:flex;align-items:flex-end;gap:5px}
.row.mine .line{flex-direction:row-reverse}
.bubble{padding:8px 11px;border-radius:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;min-width:0;font-size:14.5px}
.theirs .bubble{background:var(--theirs);color:var(--theirs-fg);border-top-left-radius:4px}
.mine .bubble{background:var(--mine);color:var(--mine-fg);border-top-right-radius:4px}
.row.cont .bubble{border-radius:14px}
.bubble strong{font-weight:700}
.bubble.err{background:#FDECEA;color:#8A1C14}
.meta{font-size:11px;color:var(--time);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
.meta .read{display:block;color:#C9A400;font-weight:700}

.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}}

/* 빠른 질문 */
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:6px 12px;font-size:13px}

/* 입력바 */
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--bar);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.bar textarea{flex:1;min-width:0;resize:none;border:0;background:var(--field);border-radius:18px;padding:9px 14px;max-height:120px;line-height:1.4;font-size:15px}
.bar textarea:focus{outline:none}
.send{height:38px;padding:0 14px;border:0;border-radius:18px;background:var(--mine);color:var(--mine-fg);font-weight:700;font-size:14px}
.send:disabled{background:var(--field);color:var(--muted);cursor:default}

/* 설정 시트 */
.scrim{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--sheet);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.key-wrap{display:flex;gap:6px}
.sheet input[type=password],.sheet input[type=text],.sheet select{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;font-size:14px}
.ghost-btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 12px;font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}
.check input{margin-top:3px}
.actions{display:flex;gap:8px}
.actions button{flex:1;height:46px;border-radius:12px;border:0;font-weight:700;font-size:15px}
.primary{background:var(--mine);color:var(--mine-fg)}
.secondary{background:var(--field)}
.danger-link{border:0;background:none;color:var(--danger);font-size:13px;align-self:flex-start;padding:0}
.status{font-size:12.5px;min-height:1em}
.status.ok{color:#1E8E3E}.status.bad{color:var(--danger)}
.tip{background:var(--field);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.tip b{color:var(--fg)}

/* ===== NEON AURORA THEME ===== */
:root{
  --room:#090711; --header:#0b0914; --mine:#c7a6ff; --mine-fg:#160b27;
  --theirs:#171126; --theirs-fg:#f4efff; --fg:#f4efff; --muted:#b6a8ce;
  --time:#a99bc4; --bar:#0d0a17; --field:#171126; --line:#382651;
  --sheet:#100c1c; --chip:#211632e8; --danger:#ff789a; --outside:#05040a;
  color-scheme:dark;
}
body{
  background:
    radial-gradient(ellipse at 15% 10%,#6d28d944 0,transparent 34%),
    radial-gradient(ellipse at 90% 75%,#3426a944 0,transparent 35%),
    radial-gradient(ellipse at 50% 100%,#8b5cf622 0,transparent 35%),
    #05040a;
}
.phone{
  background:
    radial-gradient(ellipse at 0% 5%,#a855f722 0,transparent 35%),
    radial-gradient(ellipse at 100% 35%,#6d28d922 0,transparent 38%),
    linear-gradient(165deg,#0c0916,#090711 55%,#0b0814);
  border:1px solid #8b5cf633;
}
@media (min-width:500px){.phone{box-shadow:0 0 0 1px #a855f71a,0 25px 90px #6d28d933,0 0 42px #8b5cf71a}}
.top{background:#0b0914cc;border-bottom:1px solid #9b6cff2b;backdrop-filter:blur(18px)}
.top h1{color:#fff}
.top h1 small{color:#c9b5ef}
.icon-btn{color:#dfceff}
.icon-btn:hover{background:#a855f71c;color:#fff}
.icon-btn:focus-visible,.quick button:focus-visible,.send:focus-visible{outline:2px solid #d8b4fe;outline-offset:3px}
.log{
  background-image:
    radial-gradient(1.5px 1.5px at 14% 12%,#ffffffb8 45%,transparent 60%),
    radial-gradient(1px 1px at 76% 19%,#e9d5ffb8 45%,transparent 60%),
    radial-gradient(1.5px 1.5px at 87% 63%,#c4b5fd99 45%,transparent 60%),
    radial-gradient(1px 1px at 24% 74%,#ffffff99 45%,transparent 60%),
    radial-gradient(1px 1px at 61% 89%,#e9d5ff99 45%,transparent 60%);
  background-size:230px 210px,270px 240px,320px 290px,250px 280px,360px 330px;
}
.date{color:#e9ddff;background:#a855f72b;border:1px solid #c084fc35}
.notice{background:#171126d9;color:#e8dcff;border:1px solid #a855f738;box-shadow:0 0 20px #7c3aed12}
.avatar{
  position:relative;background:linear-gradient(145deg,#e9d5ff,#a78bfa);
  color:#28113d;border:1px solid #f5d0fe;box-shadow:0 0 18px #a855f755;
  font-size:24px;letter-spacing:0;border-radius:16px;
}
.avatar::after{content:"🐰";font-size:24px;line-height:1}
.avatar{font-size:0}
.bubble{box-shadow:0 0 0 1px #c084fc12}
.theirs .bubble{background:linear-gradient(135deg,#1b142b,#171126);border:1px solid #8b5cf733;color:#f5efff;box-shadow:0 0 18px #7c3aed0b}
.mine .bubble{background:linear-gradient(135deg,#e9d5ff,#c4b5fd);color:#1b1029;box-shadow:0 0 18px #a855f733}
.meta{color:#a99bc4}
.meta .read{color:#d8b4fe}
.quick{background:#0b0814d9;border-top:1px solid #9b6cff22;backdrop-filter:blur(12px)}
.quick button{
  color:#e6d7ff;background:#171126;border:1px solid #8b5cf755;
  transition:all .2s ease;box-shadow:inset 0 0 12px #a855f708;
}
.quick button:hover{border-color:#d8b4fe;background:#2a1941;box-shadow:0 0 16px #a855f733;transform:translateY(-1px)}
.bar{background:#0b0814;border-top:1px solid #9b6cff2b}
.bar textarea{background:#171126;color:#fff;border:1px solid #6d3a91}
.bar textarea::placeholder{color:#9887b2}
.bar textarea:focus{border-color:#c084fc;box-shadow:0 0 0 3px #a855f71c}
.send{background:linear-gradient(135deg,#e9d5ff,#a78bfa);color:#1b1029;box-shadow:0 0 18px #a855f733}
.send:disabled{background:#211632;color:#78678f;box-shadow:none}
.scrim{background:#030107c9;backdrop-filter:blur(8px)}
.sheet{background:linear-gradient(155deg,#171126,#0d0a17);border:1px solid #8b5cf755;box-shadow:0 0 40px #7c3aed20}
.sheet input[type=password],.sheet input[type=text],.sheet select{background:#171126;border-color:#51346e;color:#fff}
.sheet input:focus,.sheet select:focus{outline:1px solid #c084fc}
.primary{background:linear-gradient(135deg,#e9d5ff,#a78bfa);color:#1b1029}
.secondary,.tip{background:#211632;color:#c9b5ef}
.tip b{color:#f4efff}
.status.ok{color:#86efac}
.danger-link{color:#fda4af}
.neon-tools{display:flex;gap:7px;padding:8px 12px 4px;overflow-x:auto;scrollbar-width:none;background:#0b0814}
.neon-tools::-webkit-scrollbar{display:none}
.neon-tools a,.neon-tools button{
  flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;
  border:1px solid #8b5cf755;background:linear-gradient(120deg,#1c1430,#110d1e);
  color:#e9d5ff;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;
  box-shadow:inset 0 0 14px #a855f70b;transition:.2s
}
.neon-tools a:hover,.neon-tools button:hover{border-color:#d8b4fe;box-shadow:0 0 16px #a855f733}
.neon-tools .video-link{background:linear-gradient(110deg,#7c3aed,#a855f7);color:#fff;border-color:#c084fc}
.bunny-welcome{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 12px 2px;border-radius:16px;border:1px solid #a855f744;background:linear-gradient(110deg,#201333cc,#10101d);box-shadow:0 0 25px #7c3aed18}
.bunny-face{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#f5d0fe,#a78bfa);font-size:28px;box-shadow:0 0 20px #c084fc55}
.bunny-welcome strong{display:block;color:#fff;font-size:13px;margin-bottom:3px}
.bunny-welcome span{font-size:11px;color:#c9b5ef}
@keyframes auroraFloat{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-5px);opacity:1}}
.bunny-face{animation:auroraFloat 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bunny-face{animation:none}.quick button,.neon-tools a,.neon-tools button{transition:none}}

</style>
</head>
<body>
<div class="phone" id="phone">
  <header class="top">
    <button class="icon-btn" id="clearBtn" aria-label="대화 지우기" title="대화 지우기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>김한경 매니저 <small id="statusDot">NEON UXUI 상담소</small></h1>
    <button class="icon-btn" id="videoTopBtn" aria-label="한경닷컴 영상 보기" title="한경닷컴 영상 보기" onclick="window.open('https://www.hankyung.com/video','_blank','noopener,noreferrer')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="API 키 설정" title="API 키 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="bunny-welcome"><div class="bunny-face" aria-hidden="true">🐰</div><div><strong>안녕! 보라토끼 루미야 ✦</strong><span>UXUI PM 부트캠프 궁금한 점을 물어봐!</span></div></div>
  <nav class="neon-tools" aria-label="바로가기 기능">
    <a class="video-link" href="https://www.hankyung.com/video" target="_blank" rel="noopener noreferrer">▶ 한경닷컴 영상보기</a>
    <button type="button" id="copyChatBtn">▣ 대화 복사</button>
    <button type="button" id="downloadChatBtn">↓ 대화 저장</button>
    <button type="button" id="faqBtn">✦ 자주 묻는 질문</button>
  </nav>
  <main class="log" id="log" aria-live="polite"></main>

  <nav class="quick" id="quick" aria-label="빠른 질문">
    <button type="button">커리큘럼이 궁금해요</button>
    <button type="button">비전공자도 가능한가요?</button>
    <button type="button">PM과 UXUI 디자이너 차이</button>
    <button type="button">포트폴리오는 어떻게 준비해요?</button>
    <button type="button">수업 시간과 방식</button>
    <button type="button">수료 후 취업 지원</button>
    <button type="button">수강료와 국비 지원</button>
    <button type="button">피그마를 처음 써도 되나요?</button>
  </nav>

  <form class="bar" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="메시지 입력" aria-label="메시지 입력"></textarea>
    <button class="send" id="sendBtn" type="submit" disabled>전송</button>
  </form>

  <!-- API 키 설정 시트 -->
  <div class="scrim" id="scrim" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Groq API 키 연결</h2>
      <p>키는 이 브라우저 안에만 보관되고, 대화할 때 Groq 서버(api.groq.com)로만 전송돼요. 다른 곳으로는 보내지 않아요.</p>

      <div class="field">
        <label for="keyInput">API 키</label>
        <div class="key-wrap">
          <input id="keyInput" type="password" placeholder="gsk_로 시작하는 키" spellcheck="false" autocomplete="off">
          <button type="button" class="ghost-btn" id="toggleKey">보기</button>
        </div>
        <div class="status" id="keyStatus"></div>
      </div>

      <label class="check"><input type="checkbox" id="remember">
        <span>이 기기에 기억하기<br><span style="color:var(--muted)">끄면 탭을 닫을 때 키가 자동으로 지워져요. 공용 PC에서는 꺼 두세요.</span></span>
      </label>

      <div class="field">
        <label for="modelSel">모델</label>
        <select id="modelSel"></select>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="cancelBtn">닫기</button>
        <button type="button" class="primary" id="saveBtn">연결하기</button>
      </div>
      <button type="button" class="danger-link" id="forgetBtn">저장된 키 삭제</button>

      <div class="tip"><b>키 발급:</b> console.groq.com → API Keys → Create API Key<br>
        <b>보안 팁:</b> 키를 코드나 깃허브에 직접 적지 마세요. 여러 사람에게 배포할 때는 키를 서버(프록시)에 두는 방식이 안전해요.</div>
    </section>
  </div>
</div>

<script>
/* ================================================================
   1) 아카데미 정보 — 실제 운영 정보로 바꿔 넣으면 김한경 매니저가
      이 내용을 기준으로 답해요. 비워 둔 항목은 "확인 후 안내"로 답해요.
   ================================================================ */
const ACADEMY_INFO = `
- 기관: 한국경제아카데미
- 과정명: UXUI PM 부트캠프
- 교육 기간 / 일정: (운영팀 확인 필요)
- 수업 방식(온라인/오프라인, 시간대): (운영팀 확인 필요)
- 수강료 / 국비 지원 여부: (운영팀 확인 필요)
- 지원 자격 / 선발 절차: (운영팀 확인 필요)
- 주요 커리큘럼(예시): 서비스 기획 기초, 사용자 리서치, 페르소나·여정 지도, 정보구조(IA)와 와이어프레임, Figma UI 디자인, 프로토타이핑과 사용성 테스트, 프로덕트 지표와 데이터 기반 의사결정, 애자일·스크럼 협업, 팀 프로젝트, 포트폴리오 완성
- 수료 후 지원: 포트폴리오 리뷰, 이력서·면접 코칭 (세부 내용은 운영팀 확인 필요)
- 문의처: (운영팀 연락처 입력)
`;

const SYSTEM_PROMPT = `너는 "김한경"이야. 30대 중반으로, 한국경제아카데미 UXUI PM 부트캠프의 매니저야.
수강 희망자와 수강생의 질문에 카카오톡으로 답하는 상황이야.

[말투]
- 친근하고 믿음직한 존댓말("~요"). 카톡처럼 짧게, 보통 2~5문장. 필요할 때만 짧은 목록.
- 이모티콘은 가끔만(예: 😊, 🙌). 과장된 홍보 문구는 쓰지 않아.
- 상대가 비전공자이거나 막막해하면 먼저 공감하고 구체적인 다음 행동을 알려줘.

[다룰 수 있는 주제]
- 부트캠프 과정 안내: 커리큘럼, 수업 방식, 일정, 지원 절차, 수료 후 지원
- UX/UI 디자인, 서비스 기획, PM(프로덕트 매니저) 직무에 대한 설명과 커리어 상담
- 포트폴리오, Figma 같은 도구, 학습 방법, 취업 준비 조언

[과정 정보 — 이 내용만 사실로 말해]
${ACADEMY_INFO}

[규칙]
- 위 정보에 없거나 "(운영팀 확인 필요)"인 구체적 수치(수강료, 날짜, 합격률, 취업률 등)는 절대 지어내지 마. "정확한 내용은 운영팀에 확인해서 안내드릴게요" 또는 공식 홈페이지 확인을 권해.
- 취업을 보장한다고 말하지 마.
- 부트캠프·UXUI·PM·커리어와 무관한 질문은 짧게 답하거나 정중하게 주제를 돌려.
- AI냐고 물으면 "김한경 매니저 역할을 하는 AI 상담 챗봇"이라고 솔직히 말해.`;

const DEFAULT_MODELS = ["llama-3.3-70b-versatile","openai/gpt-oss-120b","llama-3.1-8b-instant"];
const API = "https://api.groq.com/openai/v1";
const HISTORY_LIMIT = 20;

/* ================================================================
   2) 안전한 키 보관 — 기본은 sessionStorage(탭 닫으면 삭제),
      "기억하기"를 켠 경우에만 localStorage. 키는 화면·로그에 노출 안 함.
   ================================================================ */
const store = {
  get(k){ try{ return sessionStorage.getItem(k) ?? localStorage.getItem(k); }catch{ return null; } },
  set(k,v,persist){
    try{ sessionStorage.setItem(k,v); }catch{}
    try{ persist ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch{}
  },
  del(k){ try{ sessionStorage.removeItem(k); localStorage.removeItem(k);}catch{} }
};
let apiKey = store.get("groq_key") || "";
let model = (()=>{ try{ return localStorage.getItem("groq_model") || DEFAULT_MODELS[0]; }catch{ return DEFAULT_MODELS[0]; } })();

/* ================================================================
   3) 화면
   ================================================================ */
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("sendBtn");
let history = [];          // {role, content}
let busy = false;
let lastSender = null, lastMinute = null;

const timeStr = d => d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"});
function escapeHTML(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function format(s){ return escapeHTML(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/^#{1,6}\s*/gm,""); }
const scrollDown = () => { log.scrollTop = log.scrollHeight; };

function addDate(){
  const d = new Date();
  const el = document.createElement("div");
  el.className = "date";
  el.textContent = d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  log.appendChild(el);
}
function addNotice(text){
  const el = document.createElement("div");
  el.className = "notice"; el.innerHTML = text;
  log.appendChild(el); scrollDown(); lastSender = null;
}

// 같은 사람이 같은 분에 연달아 보내면 프로필·시간을 묶어서 카톡처럼 표시
function addBubble(who, text, {error=false}={}){
  const now = new Date(), minute = timeStr(now);
  const cont = lastSender === who && lastMinute === minute;
  if (cont){ const prevMeta = log.querySelector(".row:last-of-type .meta"); if (prevMeta && prevMeta.dataset.who===who) prevMeta.remove(); }

  const row = document.createElement("div");
  row.className = `row ${who==="me"?"mine":"theirs"}${cont?" cont":""}`;
  let html = "";
  if (who==="bot") html += `<div class="avatar${cont?" ghost":""}" aria-hidden="true">한경</div>`;
  html += `<div class="col">${who==="bot"&&!cont?'<span class="name">김한경</span>':""}
    <div class="line"><div class="bubble${error?" err":""}"></div>
    <span class="meta" data-who="${who}">${minute}</span></div></div>`;
  row.innerHTML = html;
  const bubble = row.querySelector(".bubble");
  if (text === null) bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else bubble.innerHTML = format(text);
  log.appendChild(row); scrollDown();
  lastSender = who; lastMinute = minute;
  return bubble;
}

/* ================================================================
   4) Groq 호출 (스트리밍)
   ================================================================ */
async function ask(userText){
  history.push({role:"user",content:userText});
  const bubble = addBubble("bot", null);
  busy = true; updateSend();

  try{
    const res = await fetch(`${API}/chat/completions`,{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${apiKey}` },
      body: JSON.stringify({
        model,
        stream:true,
        temperature:0.7,
        max_tokens:700,
        messages:[{role:"system",content:SYSTEM_PROMPT}, ...history.slice(-HISTORY_LIMIT)]
      })
    });

    if (!res.ok){
      let detail = ""; try{ detail = (await res.json())?.error?.message || ""; }catch{}
      throw Object.assign(new Error(detail), {status:res.status});
    }

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", full = "";
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines){
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") continue;
        try{
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta){ full += delta; bubble.innerHTML = format(full); scrollDown(); }
        }catch{}
      }
    }
    if (!full) full = "음, 답변을 만들지 못했어요. 한 번만 다시 물어봐 주시겠어요?";
    bubble.innerHTML = format(full);
    history.push({role:"assistant",content:full});
  }catch(e){
    history.pop();
    bubble.classList.add("err");
    bubble.textContent = errorText(e);
    if (e.status === 401) openSettings("키가 맞지 않아요. 다시 확인해 주세요.","bad");
  }finally{
    busy = false; updateSend(); input.focus();
  }
}

function errorText(e){
  switch(e.status){
    case 401: return "API 키가 올바르지 않아요. 오른쪽 위 설정에서 키를 다시 입력해 주세요.";
    case 404: return `선택한 모델(${model})을 찾을 수 없어요. 설정에서 다른 모델을 골라 주세요.`;
    case 429: return "요청이 잠시 몰렸어요. 몇 초 뒤에 다시 보내 주세요.";
    case 400: return `요청 형식 오류: ${e.message || "모델을 바꿔 보세요."}`;
    default:
      if (!e.status) return "Groq 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나, 이 파일을 브라우저에서 직접 열었는지 확인해 주세요.";
      return `오류가 났어요 (${e.status}). ${e.message || ""}`;
  }
}

/* ================================================================
   5) 설정 시트
   ================================================================ */
const scrim = $("scrim"), keyInput = $("keyInput"), keyStatus = $("keyStatus"), modelSel = $("modelSel");

function fillModels(list){
  const set = [...new Set([model, ...list])];
  modelSel.innerHTML = set.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join("");
  modelSel.value = model;
}
fillModels(DEFAULT_MODELS);

function openSettings(msg="", kind=""){
  keyInput.value = "";
  keyInput.placeholder = apiKey ? `저장됨 · gsk_••••${apiKey.slice(-4)}` : "gsk_로 시작하는 키";
  $("remember").checked = (()=>{ try{ return !!localStorage.getItem("groq_key"); }catch{ return false; } })();
  keyStatus.textContent = msg; keyStatus.className = "status " + kind;
  scrim.hidden = false;
  setTimeout(()=>keyInput.focus(), 50);
}
function closeSettings(){ scrim.hidden = true; keyInput.value = ""; keyInput.type = "password"; $("toggleKey").textContent="보기"; }

async function verifyKey(k){
  const r = await fetch(`${API}/models`,{headers:{Authorization:`Bearer ${k}`}});
  if (!r.ok) throw Object.assign(new Error(),{status:r.status});
  const j = await r.json();
  return (j.data||[]).filter(m=>m.active!==false && !/whisper|tts|guard|playai|orpheus/i.test(m.id)).map(m=>m.id).sort();
}

$("saveBtn").onclick = async () => {
  const typed = keyInput.value.trim();
  const k = typed || apiKey;
  model = modelSel.value;
  try{ localStorage.setItem("groq_model", model); }catch{}
  if (!k){ keyStatus.textContent = "키를 입력해 주세요."; keyStatus.className="status bad"; return; }
  if (typed && !/^gsk_[A-Za-z0-9]{20,}$/.test(typed)){ keyStatus.textContent = "Groq 키는 gsk_로 시작해요. 공백 없이 붙여넣어 주세요."; keyStatus.className="status bad"; return; }

  keyStatus.textContent = "키 확인 중…"; keyStatus.className = "status";
  try{
    const models = await verifyKey(k);
    apiKey = k;
    store.set("groq_key", k, $("remember").checked);
    if (models.length){ fillModels(models); if (!models.includes(model)) { model = models.includes(DEFAULT_MODELS[0]) ? DEFAULT_MODELS[0] : models[0]; modelSel.value = model; try{localStorage.setItem("groq_model",model);}catch{} } }
    keyStatus.textContent = "연결됐어요."; keyStatus.className = "status ok";
    updateSend();
    setTimeout(()=>{ closeSettings(); if (history.length===0) greet(); }, 500);
  }catch(e){
    const framed = (()=>{ try{ return window.top !== window.self; }catch{ return true; } })();
    keyStatus.textContent =
      e.status===401 ? "유효하지 않은 키예요. 다시 확인해 주세요. (401)" :
      e.status===403 ? "접근이 거부됐어요 (403). 회사·학교 네트워크나 VPN이 막고 있을 수 있어요. 다른 네트워크(휴대폰 핫스팟)로 시도해 보세요." :
      e.status===429 ? "요청 한도를 넘었어요 (429). 1분쯤 뒤에 다시 시도해 주세요." :
      e.status ? `Groq 서버 오류 (${e.status}). 잠시 후 다시 시도해 주세요.` :
      framed ? "미리보기 화면 안에서는 외부 연결이 막혀 있어요. 파일을 다운로드해서 크롬·사파리로 직접 열어 주세요." :
      "Groq 서버에 닿지 못했어요. 광고 차단 확장 프로그램을 끄거나 다른 네트워크에서 시도해 주세요.";
    keyStatus.className = "status bad";
  }
};
$("cancelBtn").onclick = closeSettings;
scrim.onclick = e => { if (e.target === scrim) closeSettings(); };
document.addEventListener("keydown", e => { if (e.key==="Escape" && !scrim.hidden) closeSettings(); });
$("toggleKey").onclick = () => { const show = keyInput.type==="password"; keyInput.type = show?"text":"password"; $("toggleKey").textContent = show?"숨기기":"보기"; };
$("forgetBtn").onclick = () => { store.del("groq_key"); apiKey=""; keyStatus.textContent="저장된 키를 삭제했어요."; keyStatus.className="status ok"; keyInput.placeholder="gsk_로 시작하는 키"; updateSend(); };
$("settingsBtn").onclick = () => openSettings();
$("copyChatBtn").addEventListener("click", async () => {
  const text = [...log.querySelectorAll(".row")].map(row => {
    const who = row.classList.contains("mine") ? "나" : "루미 · 김한경 매니저";
    const bubble = row.querySelector(".bubble");
    return bubble ? `${who}: ${bubble.innerText.replace(/\s+/g," ").trim()}` : "";
  }).filter(Boolean).join("\n");
  try {
    await navigator.clipboard.writeText(text || "아직 대화가 없어요.");
    $("copyChatBtn").textContent = "✓ 복사 완료";
    setTimeout(()=>$("copyChatBtn").textContent="▣ 대화 복사",1600);
  } catch {
    const area=document.createElement("textarea");area.value=text;document.body.appendChild(area);area.select();
    try{document.execCommand("copy");$("copyChatBtn").textContent="✓ 복사 완료";}catch{alert("복사가 지원되지 않아요. 대화를 선택해 복사해 주세요.");}
    area.remove();setTimeout(()=>$("copyChatBtn").textContent="▣ 대화 복사",1600);
  }
});
$("downloadChatBtn").addEventListener("click", () => {
  const text = [...log.querySelectorAll(".row")].map(row => {
    const who = row.classList.contains("mine") ? "나" : "루미 · 김한경 매니저";
    return `${who}: ${row.querySelector(".bubble")?.innerText || ""}`;
  }).join("\n\n");
  const blob=new Blob([text || "아직 대화가 없어요."],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url;a.download="lumi-chat-history.txt";a.click();URL.revokeObjectURL(url);
});
$("faqBtn").addEventListener("click", () => {
  const questions=["커리큘럼이 궁금해요","비전공자도 가능한가요?","포트폴리오는 어떻게 준비해요?","수강료와 국비 지원이 궁금해요"];
  const panel=document.createElement("div");panel.className="notice";
  panel.innerHTML="<strong>✦ 자주 묻는 질문</strong><br>"+questions.map((q,i)=>`<button type="button" data-faq="${i}" style="margin:6px 3px 0 0;padding:7px 10px;border:1px solid #8b5cf7;border-radius:12px;background:#211632;color:#f4efff">${q}</button>`).join("");
  log.appendChild(panel);scrollDown();
  panel.querySelectorAll("[data-faq]").forEach(b=>b.addEventListener("click",()=>{input.value=b.textContent;updateSend();if(apiKey)$("form").requestSubmit();else openSettings("먼저 Groq API 키를 연결해 주세요.","bad");}));
});
modelSel.onchange = () => { model = modelSel.value; try{ localStorage.setItem("groq_model",model);}catch{} };

/* ================================================================
   6) 입력 · 전송
   ================================================================ */
function updateSend(){ sendBtn.disabled = busy || !input.value.trim(); }
input.addEventListener("input", () => { input.style.height="auto"; input.style.height = Math.min(input.scrollHeight,120)+"px"; updateSend(); });
input.addEventListener("keydown", e => {
  if (e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  if (!apiKey){ openSettings("먼저 Groq API 키를 연결해 주세요.","bad"); return; }
  addBubble("me", text);
  input.value=""; input.style.height="auto"; updateSend();
  ask(text);
});
$("quick").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || busy) return;
  input.value = b.textContent; updateSend(); $("form").requestSubmit();
});
$("clearBtn").onclick = () => { history = []; log.innerHTML=""; lastSender=null; start(); };

/* ================================================================
   7) 시작
   ================================================================ */
function greet(){
  addBubble("bot","안녕! 나는 보라토끼 루미야 🐰 한국경제아카데미 UXUI PM 부트캠프 상담을 도와줄게!");
  addBubble("bot","커리큘럼, 비전공자 지원, 포트폴리오 준비부터 한경닷컴 영상까지! 아래 버튼으로 편하게 둘러봐 ✨");
}
function start(){
  addDate();
  if (apiKey) greet();
  else {
    addNotice("대화를 시작하려면 Groq API 키를 연결해 주세요.<br>오른쪽 위 ⚙ 버튼을 눌러 입력할 수 있어요.");
    setTimeout(()=>openSettings(), 400);
  }
}
start();
</script>
